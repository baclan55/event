services:
  # Локальный Postgres — только с профилем local-db:
  #   docker compose --profile local-db up -d
  # При Neon (DATABASE_URL на *.neon.tech) профиль не нужен.
  db:
    profiles: ["local-db"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventportal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventportal}
      POSTGRES_DB: ${POSTGRES_DB:-eventportal}
    volumes:
      - db-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventportal} -d ${POSTGRES_DB:-eventportal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-}
      SESSION_SECRET: ${SESSION_SECRET}
      DISCORD_OWNER_ID: ${DISCORD_OWNER_ID}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-https://event.mjdn.ru/api/auth/discord/callback}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_EVENTS_CHANNEL_ID: ${DISCORD_EVENTS_CHANNEL_ID}
      DISCORD_EVENTS_SOURCE_BOT_ID: ${DISCORD_EVENTS_SOURCE_BOT_ID}
      EVENT_BOT_CATCHUP_LIMIT: ${EVENT_BOT_CATCHUP_LIMIT}
      EVENT_BOT_CATCHUP_DELAY_MS: ${EVENT_BOT_CATCHUP_DELAY_MS:-15000}
      APPLY_SCHEMA_ON_START: ${APPLY_SCHEMA_ON_START:-1}
      APPLICATIONS_WEBHOOK_URL: ${APPLICATIONS_WEBHOOK_URL}
      CLOUDINARY_URL: ${CLOUDINARY_URL}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      APP_TITLE: ${APP_TITLE:-Events Denver}
      APP_SUBTITLE: ${APP_SUBTITLE:-Ивент-отдел сервера}
      WEEKLY_EVENTS_TARGET: ${WEEKLY_EVENTS_TARGET:-5}
      WEEKLY_RESET_TZ: ${WEEKLY_RESET_TZ:-Europe/Moscow}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      APP_DOMAIN: ${APP_DOMAIN:-event.mjdn.ru}
      DISABLE_EMBEDDED_BOT: ${DISABLE_EMBEDDED_BOT:-1}
      # Discord OAuth через CF Worker на discord-relay.event.mjdn.ru
      DISCORD_RELAY_URL: ${DISCORD_RELAY_URL:-https://discord-relay.event.mjdn.ru}
      DISCORD_RELAY_SECRET: ${DISCORD_RELAY_SECRET:-}
      DISCORD_PROXY: ${DISCORD_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
    expose:
      - "3000"

  # Discord-бот учёта посещаемости — отдельный процесс (свой пул/restart).
  event-bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    command: ["node", "src/bot/standalone.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_EVENTS_CHANNEL_ID: ${DISCORD_EVENTS_CHANNEL_ID}
      DISCORD_EVENTS_SOURCE_BOT_ID: ${DISCORD_EVENTS_SOURCE_BOT_ID}
      EVENT_BOT_CATCHUP_LIMIT: ${EVENT_BOT_CATCHUP_LIMIT}
      EVENT_BOT_CATCHUP_DELAY_MS: ${EVENT_BOT_CATCHUP_DELAY_MS:-15000}
      EVENT_BOT_POLL_MS: ${EVENT_BOT_POLL_MS:-30000}
      NODE_ENV: ${NODE_ENV:-production}
      # Тот же relay, что у app (OAuth + REST для бота)
      DISCORD_RELAY_URL: ${DISCORD_RELAY_URL:-https://discord-relay.event.mjdn.ru}
      DISCORD_RELAY_SECRET: ${DISCORD_RELAY_SECRET:-}
      DISCORD_PROXY: ${DISCORD_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-event.mjdn.ru}
      ACME_EMAIL: ${ACME_EMAIL:-admin@event.mjdn.ru}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /etc/caddy/Caddyfile <<EOF
        {
        	email $${ACME_EMAIL}
        }
        https://$${APP_DOMAIN} {
        	encode gzip
        	reverse_proxy app:3000 {
        		header_up X-Forwarded-Proto https
        		header_up X-Forwarded-Host {host}
        		header_up X-Real-IP {remote_host}
        	}
        }
        http://$${APP_DOMAIN} {
        	redir https://$${APP_DOMAIN}{uri} permanent
        }
        :80, :443 {
        	respond "Not Found" 404
        }
        EOF
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # Web-админка PostgreSQL — только с профилем local-db.
  pgadmin:
    profiles: ["local-db"]
    image: dpage/pgadmin4:8
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-changeme}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    expose:
      - "80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  caddy-data:
  caddy-config:
  pgadmin-data:
