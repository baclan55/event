services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventportal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventportal}
      POSTGRES_DB: ${POSTGRES_DB:-eventportal}
    volumes:
      - db-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventportal} -d ${POSTGRES_DB:-eventportal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://eventportal:eventportal@db:5432/eventportal}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET обязателен}
      DISCORD_OWNER_ID: ${DISCORD_OWNER_ID:-}
      APP_TITLE: ${APP_TITLE:-Events Denver}
      APP_SUBTITLE: ${APP_SUBTITLE:-Ивент-отдел сервера}
      WEEKLY_EVENTS_TARGET: ${WEEKLY_EVENTS_TARGET:-5}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-https://event.mjdn.ru/api/auth/discord/callback}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      APPLICATIONS_WEBHOOK_URL: ${APPLICATIONS_WEBHOOK_URL:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      APP_DOMAIN: ${APP_DOMAIN:-event.mjdn.ru}
      DISCORD_RELAY_SECRET: ${DISCORD_RELAY_SECRET:-}
      DISCORD_RELAY_URL: ${DISCORD_RELAY_URL:-https://hidden-union-525e.majes.workers.dev}
      NODE_ENV: production
      PORT: "3000"
      # Автомиграция schema.sql при старте контейнера (entrypoint + fallback в app).
      # Отключить: APPLY_SCHEMA_ON_START=0
      APPLY_SCHEMA_ON_START: ${APPLY_SCHEMA_ON_START:-1}
    depends_on:
      db:
        condition: service_healthy

  event-bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    restart: on-failure
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://eventportal:eventportal@db:5432/eventportal}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_RELAY_URL: ${DISCORD_RELAY_URL:-https://hidden-union-525e.majes.workers.dev}
      DISCORD_RELAY_SECRET: ${DISCORD_RELAY_SECRET:-}
      DISCORD_EVENTS_CHANNEL_ID: ${DISCORD_EVENTS_CHANNEL_ID:-1446581838100430878}
      DISCORD_EVENTS_SOURCE_BOT_ID: ${DISCORD_EVENTS_SOURCE_BOT_ID:-1468289401795903690}
      EVENT_BOT_CATCHUP_LIMIT: ${EVENT_BOT_CATCHUP_LIMIT:-50}
      EVENT_BOT_POLL_MS: ${EVENT_BOT_POLL_MS:-30000}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  caddy:
    build:
      context: .
      dockerfile: Dockerfile
      target: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-event.mjdn.ru}
      ACME_EMAIL: ${ACME_EMAIL:-admin@event.mjdn.ru}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@eventportal.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-changeme}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      POSTGRES_USER: ${POSTGRES_USER:-eventportal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventportal}
      POSTGRES_DB: ${POSTGRES_DB:-eventportal}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /pgadmin4
        cat > /pgadmin4/servers.json <<EOF
        {
          "Servers": {
            "1": {
              "Name": "eventportal-db",
              "Group": "Servers",
              "Host": "db",
              "Port": 5432,
              "MaintenanceDB": "$${POSTGRES_DB}",
              "Username": "$${POSTGRES_USER}",
              "SSLMode": "prefer",
              "PassFile": "/tmp/pgpass"
            }
          }
        }
        EOF
        echo "db:5432:*:$${POSTGRES_USER}:$${POSTGRES_PASSWORD}" > /tmp/pgpass
        chmod 600 /tmp/pgpass
        exec /entrypoint.sh
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  caddy-data:
  caddy-config:
  pgadmin-data:
