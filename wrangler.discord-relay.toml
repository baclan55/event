# Discord OAuth relay — только обмен code→user для VDS.
# Поддомен: discord-relay.event.mjdn.ru (сайт event.mjdn.ru не трогаем).
name = "event-denver-discord-relay"
main = "cloudflare-discord-relay.js"
compatibility_date = "2026-08-05"

# Кастомный домен Worker (зона mjdn.ru уже в Cloudflare).
routes = [
  { pattern = "discord-relay.event.mjdn.ru/*", zone_name = "mjdn.ru" }
]
