# Render Blueprint. Позволяет создать сервис через "New +" -> "Blueprint" в Render,
# указав на репозиторий с этим проектом. Базу данных (Neon) blueprint не создаёт —
# её нужно создать отдельно на neon.tech и вставить строку подключения в переменную
# DATABASE_URL (см. README.md, раздел «Деплой на Render»).
services:
  - type: web
    name: event-department-portal
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DISCORD_OWNER_ID
        sync: false
      - key: APP_TITLE
        value: Events Denver
      - key: APP_SUBTITLE
        value: Ивент-отдел сервера
      - key: WEEKLY_EVENTS_TARGET
        value: "5"
      # Часовой пояс, по которому считается граница недели (понедельник
      # 00:00) для еженедельного сброса "МП в неделю" — см. README.md,
      # раздел «Переменные окружения».
      - key: WEEKLY_RESET_TZ
        value: Europe/Moscow
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: APPLICATIONS_WEBHOOK_URL
        sync: false
      # Опционально — если задать, аватары сотрудников будут храниться в
      # Cloudinary вместо базы данных (см. README.md, раздел «Аватары через
      # Cloudinary»). Можно оставить пустыми — тогда аватары продолжат
      # храниться в Postgres, как раньше.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Бот учёта посещаемости мероприятий (см. README.md, раздел «Discord-бот
      # учёта посещаемости»). Без DISCORD_BOT_TOKEN бот просто не запускается,
      # остальной сайт продолжает работать как обычно.
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_EVENTS_CHANNEL_ID
        value: "1446581838100430878"
      - key: DISCORD_EVENTS_SOURCE_BOT_ID
        value: "1468289401795903690"
      - key: EVENT_BOT_CATCHUP_LIMIT
        value: "50"
